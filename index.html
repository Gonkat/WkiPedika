<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Учебная демонстрация оверлея</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* iframe */
.iframe-wrapper {
    position: fixed;
    inset: 0;
    z-index: 1;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    filter: brightness(0.95);
}

/* overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.alert-box {
    background: #fff;
    width: 380px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 15px 50px rgba(0,0,0,.4);
    animation: popup .25s ease;
}

@keyframes popup {
    from { transform: scale(.9); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}

.alert-box h3 {
    margin-top: 0;
    color: #c62828;
}

.fake-input {
    margin-top: 10px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 5px;
    font-size: 14px;
    color: #777;
}

.note {
    margin-top: 14px;
    font-size: 12px;
    color: #555;
    text-align: center;
}
</style>
</head>

<body>

<div class="iframe-wrapper">
    <iframe src="https://ru.wikipedia.org"></iframe>
</div>

<div class="overlay" id="overlay">
    <div class="alert-box">
        <h3>⚠️ Пример социальной инженерии</h3>

        <p>
            Так может выглядеть поддельное окно поверх настоящего сайта.
            Пользователь думает, что это часть страницы.
        </p>

        <div class="fake-input">Поле логина (макет)</div>
        <div class="fake-input">Поле пароля (макет)</div>

        <div class="note">
            Учебная демонстрация.<br>
            Никакие данные не вводятся и не отправляются.
        </div>
    </div>
</div>

<script>
const overlay = document.getElementById('overlay');
let opened = false;

document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'r') {
        opened = !opened;
        overlay.style.display = opened ? 'flex' : 'none';
    }
});
</script>

</body>
</html>
