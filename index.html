<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учебный макет входа — вызов по клавише R</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        /* iframe-обёртка */
        .iframe-wrapper {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: brightness(0.95);
        }

        /* Фишинговый оверлей */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .alert-box {
            background: #ffffff;
            width: 360px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popup 0.3s ease;
        }

        @keyframes popup {
            from { transform: scale(0.9); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .alert-box h3 {
            margin-top: 0;
            color: #c62828;
        }

        .alert-box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 14px;
        }

        .alert-box button {
            width: 100%;
            padding: 10px;
            background: #c62828;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .alert-box button:hover {
            background: #b71c1c;
        }

        .note {
            margin-top: 12px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }

        .hint {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="iframe-wrapper">
    <!-- ТУТ ТВОЙ САЙТ. Заменить на локальную копию, если внешний сайт блокирует iframe -->
    <iframe src="https://ru.wikipedia.org"></iframe>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
    <div class="alert-box" role="dialog" aria-labelledby="alertTitle">
        <h3 id="alertTitle">⚠️ Подозрительная активность</h3>
        <p>
            Мы заметили необычный вход в аккаунт.<br>
            Пожалуйста, подтвердите данные, иначе доступ будет временно ограничен.
        </p>

        <input type="text" placeholder="Email или логин">
        <input type="password" placeholder="Пароль">

        <button onclick="showWarning()">Подтвердить</button>

        <div class="note">
            Учебный макет. Данные никуда не отправляются.
        </div>
    </div>
</div>

<div class="hint">Нажми <strong>R</strong> — показать / скрыть учебное окно</div>

<script>
    // Переключатель оверлея по клавише R
    const overlay = document.getElementById('overlay');

    function toggleOverlay() {
        const isVisible = overlay.style.display === 'flex';
        overlay.style.display = isVisible ? 'none' : 'flex';
        overlay.setAttribute('aria-hidden', String(!isVisible));

        // при показе устанавливаем фокус на первое поле
        if (!isVisible) {
            const firstInput = overlay.querySelector('input');
            if (firstInput) firstInput.focus();
        } else {
            // при скрытии возвращаем фокус на документ
            document.activeElement.blur && document.activeElement.blur();
        }
    }

    // Игнорируем R когда пользователь печатает в input/textarea
    function isTyping() {
        const tag = document.activeElement && document.activeElement.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key && e.key.toLowerCase() === 'r' && !isTyping()) {
            e.preventDefault();
            toggleOverlay();
        }
    });

    function showWarning() {
        alert(
            "❗ ВНИМАНИЕ\n\n" +
            "Это был учебный пример фишинговой атаки.\n\n" +
            "Настоящие сайты НИКОГДА не просят вводить пароль во всплывающих окнах."
        );
        // Закрываем оверлей после показа предупреждения
        overlay.style.display = 'none';
        overlay.setAttribute('aria-hidden', 'true');
    }

    // Подсказка: если внешний сайт блокирует iframe (ERR_BLOCKED_BY_RESPONSE),
    // замени iframe на srcdoc с локальной копией макета.
</script>

</body>
</html>
